name: deskflow-linux

"on":
  workflow_dispatch:
  push:
    paths:
      - "deskflow-master/**"
      - "localsend-main/**"
      - ".github/workflows/deskflow-linux.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIBEI_COMMIT: 8a46bf3d4b6af7f25a61be53386cf618218114ef
      LIBPORTAL_COMMIT: c23024018c8eb076549a1517fcb2d7f80d3e2ed5
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config meson python3-jinja2 python3-attr python3-yaml \
            libevdev-dev libglib2.0-dev libsystemd-dev libx11-dev libxtst-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxi-dev libxkbfile-dev \
            libxkbcommon-dev libxkbregistry-dev libice-dev libsm-dev libssl-dev \
            libgl1-mesa-dev libdbus-1-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 xvfb
      - name: Cache Linux source dependencies
        id: linux-deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/linux-deps
          key: linux-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBEI_COMMIT }}-${{ env.LIBPORTAL_COMMIT }}
      - name: Build and install libei and libportal
        if: steps.linux-deps.outputs.cache-hit != 'true'
        run: |
          DEPS="$RUNNER_TEMP/linux-deps"
          git init "$RUNNER_TEMP/libei"
          git -C "$RUNNER_TEMP/libei" fetch --depth=1 https://gitlab.freedesktop.org/libinput/libei "$LIBEI_COMMIT"
          git -C "$RUNNER_TEMP/libei" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/libei/build" "$RUNNER_TEMP/libei" \
            --prefix="$DEPS" --libdir=lib --buildtype=release \
            '-Ddocumentation=[]' -Dtests=disabled -Dliboeffis=disabled
          meson compile -C "$RUNNER_TEMP/libei/build"
          meson install -C "$RUNNER_TEMP/libei/build"

          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          git init "$RUNNER_TEMP/libportal"
          git -C "$RUNNER_TEMP/libportal" fetch --depth=1 https://github.com/flatpak/libportal.git "$LIBPORTAL_COMMIT"
          git -C "$RUNNER_TEMP/libportal" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/libportal/build" "$RUNNER_TEMP/libportal" \
            --prefix="$DEPS" --libdir=lib --buildtype=release \
            -Ddocs=false -Dtests=false -Dportal-tests=false -Dvapi=false \
            -Dintrospection=false -Dbackend-qt6=disabled
          meson compile -C "$RUNNER_TEMP/libportal/build"
          meson install -C "$RUNNER_TEMP/libportal/build"
      - name: Export Linux dependency paths
        run: |
          DEPS="$RUNNER_TEMP/linux-deps"
          printf '%s\n' \
            "PKG_CONFIG_PATH=$DEPS/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            "LD_LIBRARY_PATH=$DEPS/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        working-directory: localsend-main
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "localsend-main -> target"
          cache-on-failure: true
      - name: Test and build localsend-cli
        working-directory: localsend-main
        run: |
          cargo test --locked --release --package localsend --package localsend-cli
          cargo build --locked --release --package localsend-cli
      - name: Test headless file transfer over loopback
        working-directory: localsend-main
        timeout-minutes: 8
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import time

          cli = "./target/release/localsend-cli"

          def wait_for(receiver, log, predicate, timeout):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  output = log.read_text(encoding="utf-8", errors="replace")
                  if predicate(output):
                      return
                  if receiver.poll() is not None:
                      raise RuntimeError(f"Receiver exited with {receiver.returncode}")
                  time.sleep(0.1)
              raise TimeoutError(f"Receiver condition not met within {timeout}s")

          def transfer(root, files, rx_port, tx_port, authenticated=False):
              root.mkdir()
              dest = root / "received"
              dest.mkdir()
              rx_log = root / "receiver.log"
              tx_log = root / "sender.log"
              rx_env = dict(os.environ, XDG_CONFIG_HOME=str(root / "rx-config"))
              tx_env = dict(os.environ, XDG_CONFIG_HOME=str(root / "tx-config"))
              rx_args = [cli, "--port", str(rx_port), "--destination", str(dest),
                         "receive", "--auto-accept-from", "127.0.0.1"]
              tx_args = [cli, "--port", str(tx_port), "send", "--to", f"127.0.0.1:{rx_port}"]
              sender_input = None
              token = "e2e-secret-token-1234"
              if authenticated:
                  rx_args.append("--auth-stdin")
                  tx_args.extend(["--pin-stdin", "--paths-stdin"])
                  sender_input = "\n".join([token, *map(str, files)]) + "\n"
              else:
                  tx_args.extend(map(str, files))

              total = sum(path.stat().st_size for path in files)
              with rx_log.open("w", encoding="utf-8") as output:
                  receiver = subprocess.Popen(
                      rx_args, env=rx_env, text=True, stdout=output,
                      stderr=subprocess.STDOUT,
                      stdin=subprocess.PIPE if authenticated else subprocess.DEVNULL,
                  )
                  try:
                      wait_for(receiver, rx_log, lambda log: "LOCALSEND_RECEIVER_READY" in log, 30)
                      if authenticated:
                          receiver.stdin.write(f"GRANT {token}\n")
                          receiver.stdin.flush()
                      with tx_log.open("w", encoding="utf-8") as sender_output:
                          subprocess.run(
                              tx_args, env=tx_env, input=sender_input, text=True,
                              stdout=sender_output, stderr=subprocess.STDOUT,
                              timeout=120, check=True,
                          )
                      if f"SEND_PROGRESS:{total}:{total}" not in tx_log.read_text(encoding="utf-8"):
                          raise AssertionError("Missing final send byte progress")
                      wait_for(
                          receiver, rx_log,
                          lambda log: re.search(rf"RECEIVE_PROGRESS:[^:\n]+:{total}:{total}(?:\n|$)", log),
                          15,
                      )
                      for path in files:
                          expected = path.read_bytes()
                          actual = (dest / path.name).read_bytes()
                          if hashlib.sha256(expected).digest() != hashlib.sha256(actual).digest() or expected != actual:
                              raise AssertionError(f"Received content mismatch for {path.name}")
                  finally:
                      if receiver.poll() is None:
                          receiver.terminate()
                      try:
                          receiver.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          receiver.kill()
                          receiver.wait(timeout=5)
                      if receiver.stdin is not None:
                          receiver.stdin.close()
                      for log in (rx_log, tx_log):
                          if log.exists():
                              print(f"--- {log.name} ---", flush=True)
                              print(log.read_text(encoding="utf-8", errors="replace"), flush=True)

          with tempfile.TemporaryDirectory(prefix="localsend-e2e-") as tmp:
              root = Path(tmp)
              files = [root / "first.txt", root / "second.txt", root / "large.bin"]
              files[0].write_text("hello from desksend", encoding="utf-8")
              files[1].write_text("second file 12345", encoding="utf-8")
              files[2].write_bytes(bytes(range(256)) * (32 * 1024 * 1024 // 256))
              transfer(root / "plain", files, 53318, 53319)
              transfer(root / "authenticated", files[:2], 53320, 53321, authenticated=True)
          PY
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Configure CMake
        working-directory: deskflow-master
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON \
            -DBUILD_INSTALLER=OFF \
            -DDESKSEND_LOCALSEND_CLI="$GITHUB_WORKSPACE/localsend-main/target/release/localsend-cli"
      - name: Build DeskSend
        run: cmake --build deskflow-master/build
      - name: Run unit tests
        run: xvfb-run -a ctest --test-dir deskflow-master/build --output-on-failure
      - name: Install and verify staged files
        run: |
          cmake --install deskflow-master/build --prefix "$GITHUB_WORKSPACE/stage"
          stage="$GITHUB_WORKSPACE/stage"
          for executable in deskflow deskflow-core localsend-cli; do
            test -f "$stage/bin/$executable"
            test -x "$stage/bin/$executable"
          done
          test -f "$stage/share/licenses/deskflow/LocalSend-LICENSE.txt"
      - name: Archive staged installation
        run: tar -czf DeskSend-linux-x64.tar.gz -C "$GITHUB_WORKSPACE/stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: DeskSend-linux-x64
          path: DeskSend-linux-x64.tar.gz
          if-no-files-found: error
