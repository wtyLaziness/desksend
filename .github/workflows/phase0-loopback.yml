name: phase0-loopback
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  loopback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dfRun = gh run list --workflow deskflow-win --commit $env:GITHUB_SHA --status success --limit 1 --json databaseId -q '.[0].databaseId'
          $lsRun = gh run list --workflow localsend-cli-win --commit $env:GITHUB_SHA --status success --limit 1 --json databaseId -q '.[0].databaseId'
          if (!$dfRun -or !$lsRun) { throw "Both builds must succeed for commit $env:GITHUB_SHA before running E2E" }
          Write-Host "Downloading deskflow-win ($dfRun) and localsend-cli-win ($lsRun)"
          gh run download $dfRun -n deskflow-win-x64 -D df
          gh run download $lsRun -n localsend-cli-win-x64 -D ls
          Expand-Archive (Get-ChildItem df\*.zip).FullName -DestinationPath df -Force
      - name: Full E2E DeskSend drag-and-drop file transfer test (disableLockToComputer=false)
        run: |
          $dfDir = (Get-ChildItem df -Directory | Select-Object -First 1).FullName
          pwsh -STA -NoProfile -File ./phase0/loopback-test.ps1 -DeskflowDir $dfDir -LocalSendCliExe "$PWD\ls\localsend-cli.exe" -OutDir "$PWD\out" -DisableLock "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desksend-e2e-logs
          path: out/
