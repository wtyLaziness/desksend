name: deskflow-win
on:
  workflow_dispatch:
  push:
    paths: ["deskflow-master/**", "localsend-main/**", "scripts/package-release.py", "THIRD_PARTY_NOTICES.md", ".github/workflows/deskflow-win.yml"]
  pull_request:
    paths: ["deskflow-master/**", "localsend-main/**", "scripts/package-release.py", "THIRD_PARTY_NOTICES.md", ".github/workflows/deskflow-win.yml"]
jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/package-release.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
      - name: Install WiX Toolset
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP 'desksend-wix'
          dotnet tool install wix --version 4.0.6 --tool-path $wixDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($extension in @('Util', 'Firewall', 'UI')) {
            & "$wixDir/wix.exe" extension add -g "WixToolset.$extension.wixext/4.0.6"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixDir
      - name: Build LocalSend CLI for the installer
        working-directory: localsend-main
        run: |
          cargo test --locked --release --package localsend-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package localsend-cli
      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: deskflow-master/build/vcpkg_installed
          key: vcpkg-win-x64-${{ hashFiles('deskflow-master/cmake/vcpkg.json.in') }}
      - name: Configure
        working-directory: deskflow-master
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_INSTALLER=ON -DBUILD_TESTS=ON
          -DDESKSEND_LOCALSEND_CLI="$env:GITHUB_WORKSPACE/localsend-main/target/release/localsend-cli.exe"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        working-directory: deskflow-master
        run: cmake --build build
      - name: Run DeskSend unit tests
        run: ctest --test-dir deskflow-master/build/src/unittests --no-tests=error --output-on-failure
      - name: Package portable ZIP and MSI
        working-directory: deskflow-master/build
        run: |
          cpack -G ZIP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack -G WIX
      - name: Verify MSI installation and service
        working-directory: deskflow-master/build
        run: |
          $msi = @(Get-ChildItem DeskSend-*-windows-x64.msi)
          if ($msi.Count -ne 1) { throw "Expected one DeskSend x64 MSI" }
          $msiPath = $msi[0].FullName
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn /norestart /l*v desksend-install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content desksend-install.log -Tail 120
            throw "MSI install failed with exit code $($install.ExitCode)"
          }
          try {
            $service = Get-CimInstance Win32_Service -Filter "Name = 'DeskSend'"
            if ($service.State -ne 'Stopped' -or $service.StartMode -ne 'Manual' -or $service.StartName -ne 'LocalSystem') {
              throw 'MSI must install the DeskSend service as stopped and start it on demand'
            }
            $appDir = Split-Path -Parent $service.PathName.Trim('"')
            foreach ($file in @('DeskSend.exe', 'deskflow-core.exe', 'deskflow-daemon.exe', 'localsend-cli.exe', 'LocalSend-LICENSE.txt', 'THIRD_PARTY_NOTICES.md')) {
              if (!(Test-Path -LiteralPath (Join-Path $appDir $file) -PathType Leaf)) { throw "MSI is missing $file" }
            }
            if (Test-Path -LiteralPath (Join-Path $appDir 'settings/Deskflow.conf')) { throw 'MSI activates portable mode' }
            Start-Service DeskSend
            $service = Get-CimInstance Win32_Service -Filter "Name = 'DeskSend'"
            $daemon = Get-Process -Id $service.ProcessId
            $pipe = [System.IO.Pipes.NamedPipeClientStream]::new('.', 'desksend-daemon', 'InOut')
            try {
              $pipe.Connect(5000)
              $versionHeader = Get-Content "$env:GITHUB_WORKSPACE/deskflow-master/build/src/lib/common/VersionInfo.h" -Raw
              $version = [regex]::Match($versionHeader, 'kVersion = "([^"]+)"').Groups[1].Value
              $revision = [regex]::Match($versionHeader, 'kVersionGitSha = "([^"]*)"').Groups[1].Value
              if (!$version) { throw 'Cannot determine the installed daemon IPC version' }
              $hello = "hello=$version+$revision"
              $reader = [System.IO.StreamReader]::new($pipe)
              $helloBytes = [System.Text.Encoding]::UTF8.GetBytes("$hello`n")
              $pipe.Write($helloBytes, 0, $helloBytes.Length)
              $greeting = $reader.ReadLineAsync()
              if (!$greeting.Wait(5000) -or $greeting.Result -ne $hello) {
                throw 'The DeskSend service IPC did not complete hello'
              }
              $prefix = [System.Text.Encoding]::UTF8.GetBytes('log')
              $suffix = [System.Text.Encoding]::UTF8.GetBytes("Path`n")
              $pipe.Write($prefix, 0, $prefix.Length)
              Start-Sleep -Milliseconds 100
              $pipe.Write($suffix, 0, $suffix.Length)
              $reply = $reader.ReadLineAsync()
              if (!$reply.Wait(5000) -or $reply.Result -notlike 'logPath=*desksend-daemon.log') {
                throw 'The DeskSend service IPC did not return its log path'
              }
            } finally {
              $pipe.Dispose()
            }
            $env:DESKSEND_TEST_MSI_SERVICE = '1'
            $exitCheck = Start-Process src/unittests/gui/core/CoreProcessTests.exe -ArgumentList 'installedServiceStopsOnExit' -Wait -PassThru
            if ($exitCheck.ExitCode -ne 0 -or (Get-Service DeskSend).Status -ne 'Stopped' -or !$daemon.WaitForExit(5000)) {
              throw 'DeskSend exit did not stop the service and its process'
            }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msiPath`" /qn /norestart" -Wait -PassThru
            if ($uninstall.ExitCode -ne 0 -or (Get-Service DeskSend -ErrorAction SilentlyContinue)) {
              throw "MSI uninstall did not remove the DeskSend service"
            }
          }
      - name: Record Windows artifact provenance
        working-directory: deskflow-master/build
        run: |
          $packages = @(Get-ChildItem -File -Include *.zip,DeskSend-*-windows-x64.msi -Path ./*)
          if (@($packages | Where-Object Extension -eq '.zip').Count -ne 1 -or
              @($packages | Where-Object Extension -eq '.msi').Count -ne 1) {
            throw 'Expected exactly one Windows ZIP and one MSI'
          }
          foreach ($zip in $packages | Where-Object Extension -eq '.zip') {
            $entries = tar -tf $zip.FullName
            if ($LASTEXITCODE -ne 0 -or !($entries -match '/THIRD_PARTY_NOTICES[.]md$')) {
              throw 'Windows ZIP is missing THIRD_PARTY_NOTICES.md'
            }
          }
          python ../../scripts/package-release.py --write-provenance windows x64 BUILD_PROVENANCE.json @($packages.Name)
      - uses: actions/upload-artifact@v4
        with:
          name: deskflow-win-x64
          path: |
            deskflow-master/build/*.zip
            deskflow-master/build/BUILD_PROVENANCE.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desksend-windows-x64-msi
          path: |
            deskflow-master/build/DeskSend-*-windows-x64.msi
            deskflow-master/build/BUILD_PROVENANCE.json
          if-no-files-found: error
      - name: Collect update channel diagnostic test
        run: |
          New-Item -ItemType Directory diagnostics
          Copy-Item deskflow-master/build/src/unittests/gui/VersionCheckerTests.exe diagnostics/
          $testDll = Join-Path $env:QT_ROOT_DIR 'bin/Qt6Test.dll'
          if (!(Test-Path -LiteralPath $testDll)) { throw 'Qt6Test.dll not found' }
          Copy-Item -LiteralPath $testDll -Destination diagnostics/
      - uses: actions/upload-artifact@v4
        with:
          name: desksend-update-diagnostics
          path: diagnostics/
