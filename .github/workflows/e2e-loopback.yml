name: e2e-loopback
on:
  workflow_dispatch:
    inputs:
      compare_1_0_0:
        description: "Verify the reverse-jitter regression fails on the original 1.0.0 binaries"
        required: false
        type: boolean
        default: false
      binaries_commit:
        description: "Optional commit with identical production sources and successful builds"
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  loopback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BINARIES_COMMIT: ${{ inputs.binaries_commit }}
        run: |
          $buildSha = $env:GITHUB_SHA
          if ($env:BINARIES_COMMIT) {
            git fetch --depth=1 origin $env:BINARIES_COMMIT
            git diff --exit-code FETCH_HEAD $env:GITHUB_SHA -- deskflow-master localsend-main/cli localsend-main/packages/core
            if ($LASTEXITCODE -ne 0) { throw 'Production sources differ from requested binaries' }
            $buildSha = git rev-parse FETCH_HEAD
          }
          $dfRun = gh run list --workflow deskflow-win --commit $buildSha --status success --limit 1 --json databaseId -q '.[0].databaseId'
          $lsRun = gh run list --workflow localsend-cli-win --commit $buildSha --status success --limit 1 --json databaseId -q '.[0].databaseId'
          if (!$dfRun -or !$lsRun) { throw "Both builds must succeed for commit $env:GITHUB_SHA before running E2E" }
          Write-Host "Downloading deskflow-win ($dfRun) and localsend-cli-win ($lsRun)"
          gh run download $dfRun -n deskflow-win-x64 -D df
          gh run download $lsRun -n localsend-cli-win-x64 -D ls
          Expand-Archive (Get-ChildItem df\*.zip).FullName -DestinationPath df -Force
      - name: DeskSend executable identity and startup smoke test
        run: |
          $dfDir = (Get-ChildItem df -Directory | Select-Object -First 1).FullName
          ./tests/branding-test.ps1 -DeskflowDir $dfDir -OutDir "$PWD\out-branding"
      - name: Full E2E DeskSend drag-and-drop file transfer test (disableLockToComputer=false)
        run: |
          $dfDir = (Get-ChildItem df -Directory | Select-Object -First 1).FullName
          pwsh -STA -NoProfile -File ./tests/loopback-test.ps1 -DeskflowDir $dfDir -LocalSendCliExe "$PWD\ls\localsend-cli.exe" -OutDir "$PWD\out" -DisableLock "false"
      - name: Full E2E DeskSend drag-and-drop transfer over mTLS (connect + reconnect)
        run: |
          $dfDir = (Get-ChildItem df -Directory | Select-Object -First 1).FullName
          pwsh -STA -NoProfile -File ./tests/loopback-test.ps1 -DeskflowDir $dfDir -LocalSendCliExe "$PWD\ls\localsend-cli.exe" -OutDir "$PWD\out-tls" -DisableLock "false" -TlsEnabled
      - name: Esc cancels drag without transferring or moving source files
        run: |
          $dfDir = (Get-ChildItem df -Directory | Select-Object -First 1).FullName
          pwsh -STA -NoProfile -File ./tests/loopback-test.ps1 -DeskflowDir $dfDir -LocalSendCliExe "$PWD\ls\localsend-cli.exe" -OutDir "$PWD\out-cancel" -DisableLock "false" -CancelDrag
      - name: Returning to primary before release cancels drag
        run: |
          $dfDir = (Get-ChildItem df -Directory | Select-Object -First 1).FullName
          pwsh -STA -NoProfile -File ./tests/loopback-test.ps1 -DeskflowDir $dfDir -LocalSendCliExe "$PWD\ls\localsend-cli.exe" -OutDir "$PWD\out-return" -DisableLock "false" -ReturnBeforeRelease
      - name: Confirm reverse jitter fails on the original 1.0.0 build
        if: ${{ inputs.compare_1_0_0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43056794092 -n deskflow-win-x64 -D df-original
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download original baseline' }
          Expand-Archive (Get-ChildItem df-original\*.zip).FullName -DestinationPath df-original
          $original = (Get-ChildItem df-original -Directory | Select-Object -First 1).FullName
          pwsh -STA -NoProfile -File ./tests/loopback-test.ps1 -DeskflowDir $original -LocalSendCliExe "$PWD\ls\localsend-cli.exe" -OutDir "$PWD\out-original" -DisableLock "false"
          $result = $LASTEXITCODE
          $log = Get-Content out-original/test.log -Raw
          if ($result -eq 0 -or !$log.Contains('File drag bounced back immediately after screen handoff')) {
            throw 'Original build did not fail for the expected reverse-jitter reason'
          }
          Write-Output 'BOUNCE_NEGATIVE_CONTROL_PASSED: original 1.0.0 cancelled the drag on reverse jitter'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desksend-e2e-logs
          path: |
            out/*.log
            out/*.stdout
            out/*.stderr
            out/*.png
            out-tls/*.log
            out-tls/*.stdout
            out-tls/*.stderr
            out-tls/*.png
            out-cancel/*.log
            out-cancel/*.stdout
            out-cancel/*.stderr
            out-cancel/*.png
            out-return/*.log
            out-return/*.stdout
            out-return/*.stderr
            out-return/*.png
            out-branding/*.log
            out-branding/*.stdout
            out-branding/*.stderr
            out-branding/*.png
            out-original/*.log
            out-original/*.stdout
            out-original/*.stderr
            out-original/*.png
            out-branding/version.txt
            out-branding/version-error.txt
