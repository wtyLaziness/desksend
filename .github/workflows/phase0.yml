name: phase0-sentinel
on:
  workflow_dispatch:
  push:
    paths: ["phase0/**", ".github/workflows/phase0.yml"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S phase0 -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-win-x64
          path: build/Release/sentinel.exe
