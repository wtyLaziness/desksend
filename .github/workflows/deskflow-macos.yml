name: deskflow-macos

"on":
  workflow_dispatch:
  push:
    paths:
      - "deskflow-master/**"
      - "localsend-main/**"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/package-release.py"
      - ".github/workflows/deskflow-macos.yml"
  pull_request:
    paths:
      - "deskflow-master/**"
      - "localsend-main/**"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/package-release.py"
      - ".github/workflows/deskflow-macos.yml"

jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        working-directory: localsend-main
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "localsend-main -> target"
          cache-on-failure: true
      - name: Test and build localsend-cli
        working-directory: localsend-main
        run: |
          # macOS lo0 only binds 127.0.0.1 by default, so this subnet scan sees 1 device instead of >16.
          cargo test --locked --release --package localsend-cli
          cargo test --locked --release --package localsend -- --skip subnet_scan_finishes_when_events_are_not_consumed
          cargo build --locked --release --package localsend-cli
      - name: Test headless file transfer over loopback
        working-directory: localsend-main
        timeout-minutes: 8
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import time

          cli = "./target/release/localsend-cli"

          def wait_for(receiver, log, predicate, timeout):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  output = log.read_text(encoding="utf-8", errors="replace")
                  if match := predicate(output):
                      return match
                  if receiver.poll() is not None:
                      raise RuntimeError(f"Receiver exited with {receiver.returncode}")
                  time.sleep(0.1)
              raise TimeoutError(f"Receiver condition not met within {timeout}s")

          def transfer(root, files, authenticated=False, hex_paths=False):
              root.mkdir()
              dest = root / "received"
              dest.mkdir()
              rx_log = root / "receiver.log"
              tx_log = root / "sender.log"
              rx_env = dict(os.environ, XDG_CONFIG_HOME=str(root / "rx-config"))
              tx_env = dict(os.environ, XDG_CONFIG_HOME=str(root / "tx-config"))
              rx_args = [cli, "--port", "0", "--destination", str(dest),
                         "receive", "--auto-accept-from", "127.0.0.1"]
              tx_args = [cli, "--port", "0", "send"]
              sender_input = None
              token = "e2e-secret-token-1234"
              if authenticated:
                  rx_args.append("--auth-stdin")
                  tx_args.extend(["--pin-stdin", "--paths-stdin"])
                  paths = [str(path) for path in files]
                  if hex_paths:
                      rx_args.append("--received-paths-hex")
                      tx_args.extend(["--paths-stdin-hex", "--cancel-stdin"])
                      paths = [path.encode("utf-8").hex() for path in paths]
                  sender_input = "\n".join([token, *paths]) + ("\n\n" if hex_paths else "\n")
              else:
                  tx_args.extend(map(str, files))

              total = sum(path.stat().st_size for path in files)
              with rx_log.open("w", encoding="utf-8") as output:
                  receiver = subprocess.Popen(
                      rx_args, env=rx_env, text=True, stdout=output,
                      stderr=subprocess.STDOUT,
                      stdin=subprocess.PIPE if authenticated else subprocess.DEVNULL,
                  )
                  try:
                      ready = wait_for(
                          receiver, rx_log,
                          lambda log: re.search(r"^LOCALSEND_RECEIVER_READY port=([1-9]\d*) ", log, re.MULTILINE),
                          30,
                      )
                      tx_args[4:4] = ["--to", f"127.0.0.1:{ready.group(1)}"]
                      if authenticated:
                          receiver.stdin.write(f"GRANT {token}\n")
                          receiver.stdin.flush()
                      with tx_log.open("w", encoding="utf-8") as sender_output:
                          subprocess.run(
                              tx_args, env=tx_env, input=sender_input, text=True,
                              stdout=sender_output, stderr=subprocess.STDOUT,
                              timeout=120, check=True,
                          )
                      if f"SEND_PROGRESS:{total}:{total}" not in tx_log.read_text(encoding="utf-8"):
                          raise AssertionError("Missing final send byte progress")
                      wait_for(
                          receiver, rx_log,
                          lambda log: re.search(rf"RECEIVE_PROGRESS:[^:\n]+:{total}:{total}(?:\n|$)", log),
                          15,
                      )
                      if hex_paths:
                          expected_records = {f"RECEIVED_FILE_HEX:{str(dest / p.name).encode('utf-8').hex()}" for p in files}
                          wait_for(receiver, rx_log, lambda log: expected_records.issubset(log.splitlines()), 15)
                      for path in files:
                          expected = path.read_bytes()
                          actual = (dest / path.name).read_bytes()
                          if hashlib.sha256(expected).digest() != hashlib.sha256(actual).digest() or expected != actual:
                              raise AssertionError(f"Received content mismatch for {path.name}")
                  finally:
                      if receiver.poll() is None:
                          receiver.terminate()
                      try:
                          receiver.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          receiver.kill()
                          receiver.wait(timeout=5)
                      if receiver.stdin is not None:
                          receiver.stdin.close()
                      for log in (rx_log, tx_log):
                          if log.exists():
                              print(f"--- {log.name} ---", flush=True)
                              print(log.read_text(encoding="utf-8", errors="replace"), flush=True)

          with tempfile.TemporaryDirectory(prefix="localsend-e2e-") as tmp:
              root = Path(tmp)
              files = [root / "first.txt", root / "second.txt", root / "large.bin"]
              files[0].write_text("hello from desksend", encoding="utf-8")
              files[1].write_text("second file 12345", encoding="utf-8")
              files[2].write_bytes(bytes(range(256)) * (32 * 1024 * 1024 // 256))
              transfer(root / "plain", files)
              transfer(root / "authenticated", files[:2], authenticated=True)
              special = root / "line\r\nbreak.txt"
              special.write_bytes(b"line-break path")
              transfer(root / "hex-paths", [special], authenticated=True, hex_paths=True)
          PY
      - name: Install macOS build dependencies
        run: brew install ninja openssl@3
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Configure CMake
        working-directory: deskflow-master
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON \
            -DBUILD_INSTALLER=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DDESKSEND_LOCALSEND_CLI="$GITHUB_WORKSPACE/localsend-main/target/release/localsend-cli"
      - name: Build DeskSend
        run: cmake --build deskflow-master/build
      - name: Run unit tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir deskflow-master/build/src/unittests --no-tests=error --output-on-failure
      - name: Install and verify staged files
        run: |
          cmake --install deskflow-master/build --prefix "$GITHUB_WORKSPACE/stage"
          bundle="$GITHUB_WORKSPACE/stage/DeskSend.app/Contents"
          for executable in DeskSend deskflow-core localsend-cli; do
            test -f "$bundle/MacOS/$executable"
            test -x "$bundle/MacOS/$executable"
          done
          test -f "$bundle/Resources/LocalSend-LICENSE.txt"
          test -f "$bundle/Resources/THIRD_PARTY_NOTICES.md"
          codesign --verify --deep --strict "$GITHUB_WORKSPACE/stage/DeskSend.app"
          python3 - "$bundle" "$MACOSX_DEPLOYMENT_TARGET" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          def version(value):
              parts = [int(part) for part in value.split('.')]
              return tuple((parts + [0, 0])[:3])

          bundle = Path(sys.argv[1])
          target = version(sys.argv[2])
          checked = set()
          for path in bundle.rglob('*'):
              if path.is_symlink() or not path.is_file():
                  continue
              if 'Mach-O' not in subprocess.check_output(['file', '-b', path], text=True):
                  continue
              subprocess.run(['lipo', '-verify_arch', 'arm64', path], check=True)
              commands = subprocess.check_output(['otool', '-arch', 'arm64', '-l', path], text=True)
              minimum = re.search(r'\bLC_BUILD_VERSION\b[^\n]*\n\s*cmdsize \d+\n\s*platform (?:1|macos)\n\s*minos ([\d.]+)', commands, re.I)
              if minimum is None:
                  minimum = re.search(r'\bLC_VERSION_MIN_MACOSX\b[^\n]*\n\s*cmdsize \d+\n\s*version ([\d.]+)', commands)
              if minimum is None or version(minimum[1]) > target:
                  raise SystemExit(f'{path}: minimum macOS {minimum[1] if minimum else "unknown"}, expected {sys.argv[2]} or earlier')
              checked.add(path.relative_to(bundle).as_posix())
          if not {'MacOS/DeskSend', 'MacOS/deskflow-core', 'MacOS/localsend-cli'} <= checked:
              raise SystemExit('A DeskSend executable is not an arm64 Mach-O file')
          PY
      - name: Archive staged installation
        run: COPYFILE_DISABLE=1 tar -czf DeskSend-macos-arm64.tar.gz -C "$GITHUB_WORKSPACE/stage" DeskSend.app
      - name: Record macos artifact provenance
        run: python3 scripts/package-release.py --write-provenance macos arm64 BUILD_PROVENANCE.json DeskSend-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: DeskSend-macos-arm64
          path: |
            DeskSend-macos-arm64.tar.gz
            BUILD_PROVENANCE.json
          if-no-files-found: error
