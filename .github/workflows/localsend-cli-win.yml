name: localsend-cli-win
on:
  workflow_dispatch:
  push:
    paths:
      - "localsend-main/cli/**"
      - "localsend-main/packages/core/**"
      - "localsend-main/Cargo.toml"
      - "localsend-main/Cargo.lock"
      - "localsend-main/rust-toolchain.toml"
      - ".github/workflows/localsend-cli-win.yml"
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        working-directory: localsend-main
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "localsend-main -> target"
          cache-on-failure: true
      - name: Build localsend-cli and run unit tests
        working-directory: localsend-main
        run: |
          cargo test --release --package localsend --package localsend-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --package localsend-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: End-to-end headless receive & send test
        working-directory: localsend-main
        run: |
          $exe = "$PWD\target\release\localsend-cli.exe"
          $base = Join-Path $env:TEMP "ls_e2e"
          Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$base\rx_cfg", "$base\tx_cfg", "$base\rx_dest", "$base\tx_src" | Out-Null
          "hello from desksend" | Set-Content "$base\tx_src\test1.txt" -NoNewline
          "second file 12345"   | Set-Content "$base\tx_src\test2.txt" -NoNewline
          [IO.File]::WriteAllBytes("$base\tx_src\large.bin", [byte[]]::new(32MB))

          $env:XDG_CONFIG_HOME = "$base\rx_cfg"
          $rx = Start-Process $exe -ArgumentList "--port","53318","--destination","$base\rx_dest","receive","--auto-accept-from","127.0.0.1" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$base\rx.out" -RedirectStandardError "$base\rx.err"
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path "$base\rx.out") -and ((Get-Content "$base\rx.out" -Raw) -match "LOCALSEND_RECEIVER_READY")) { break }
            Start-Sleep -Milliseconds 300
          }
          Write-Host "--- Receiver initial output ---"
          Get-Content "$base\rx.out"

          $env:XDG_CONFIG_HOME = "$base\tx_cfg"
          & $exe --port 53319 send --to "127.0.0.1:53318" "$base\tx_src\test1.txt" "$base\tx_src\test2.txt" "$base\tx_src\large.bin" | Tee-Object "$base\tx.out"
          $sendExit = $LASTEXITCODE
          Start-Sleep 1
          Stop-Process $rx -Force -ErrorAction SilentlyContinue

          Write-Host "--- Receiver full stdout ---"
          Get-Content "$base\rx.out"
          Write-Host "--- Receiver stderr ---"
          Get-Content "$base\rx.err"

          if ($sendExit -ne 0) { throw "Send exited with $sendExit" }
          $total = (Get-ChildItem "$base\tx_src" -File | Measure-Object Length -Sum).Sum
          if (!((Get-Content "$base\tx.out" -Raw) -match "SEND_PROGRESS:${total}:${total}")) { throw 'Missing final send byte progress' }
          if (!((Get-Content "$base\rx.out" -Raw) -match "RECEIVE_PROGRESS:[^:]+:${total}:${total}")) { throw 'Missing final receive byte progress' }
          if ((Get-FileHash "$base\tx_src\large.bin").Hash -ne (Get-FileHash "$base\rx_dest\large.bin").Hash) { throw 'Large file hash mismatch' }
          $c1 = Get-Content "$base\rx_dest\test1.txt" -Raw
          $c2 = Get-Content "$base\rx_dest\test2.txt" -Raw
          if ($c1 -ne "hello from desksend" -or $c2 -ne "second file 12345") {
            throw "Content mismatch: c1=$c1 c2=$c2"
          }

          # Verify --auth-stdin + --pin-stdin + --paths-stdin end-to-end
          $authDir = "$base\auth_e2e"
          New-Item -ItemType Directory -Force "$authDir\rx_dest" | Out-Null
          $rxPsi = [System.Diagnostics.ProcessStartInfo]::new($exe, "--port 53320 --destination `"$authDir\rx_dest`" receive --auto-accept-from 127.0.0.1 --auth-stdin")
          $rxPsi.UseShellExecute = $false
          $rxPsi.RedirectStandardInput = $true
          $rxPsi.RedirectStandardOutput = $true
          $rxPsi.RedirectStandardError = $false
          $rxPsi.EnvironmentVariables["XDG_CONFIG_HOME"] = "$base\rx_cfg"
          $rxAuth = [System.Diagnostics.Process]::Start($rxPsi)
          while (!$rxAuth.HasExited) {
            $line = $rxAuth.StandardOutput.ReadLine()
            if ($null -eq $line -or $line -match "LOCALSEND_RECEIVER_READY") { break }
          }
          $token = "e2e-secret-token-1234"
          $rxAuth.StandardInput.WriteLine("GRANT $token")
          $rxAuth.StandardInput.Flush()

          $txPsi = [System.Diagnostics.ProcessStartInfo]::new($exe, "--port 53321 send --to 127.0.0.1:53320 --pin-stdin --paths-stdin")
          $txPsi.UseShellExecute = $false
          $txPsi.RedirectStandardInput = $true
          $txPsi.RedirectStandardOutput = $true
          $txPsi.RedirectStandardError = $false
          $txPsi.EnvironmentVariables["XDG_CONFIG_HOME"] = "$base\tx_cfg"
          $txAuth = [System.Diagnostics.Process]::Start($txPsi)
          $txAuth.StandardInput.WriteLine($token)
          $txAuth.StandardInput.WriteLine("$base\tx_src\test1.txt")
          $txAuth.StandardInput.WriteLine("$base\tx_src\test2.txt")
          $txAuth.StandardInput.Close()
          $txAuthOut = $txAuth.StandardOutput.ReadToEnd()
          if (!$txAuth.WaitForExit(30000)) {
            $txAuth.Kill()
            throw "Auth stdin send timed out"
          }
          $rxAuth.Kill()
          if ($txAuth.ExitCode -ne 0) {
            throw "Auth stdin send failed ($($txAuth.ExitCode)): out=$txAuthOut"
          }
          if ((Get-Content "$authDir\rx_dest\test1.txt" -Raw) -ne "hello from desksend" -or
              (Get-Content "$authDir\rx_dest\test2.txt" -Raw) -ne "second file 12345") {
            throw "Auth stdin transferred content mismatch"
          }
          Write-Host "E2E headless file transfer PASSED!"
      - uses: actions/upload-artifact@v4
        with:
          name: localsend-cli-win-x64
          path: localsend-main/target/release/localsend-cli.exe
          if-no-files-found: error
