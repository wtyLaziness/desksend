name: localsend-cli-win
on:
  workflow_dispatch:
  push:
    paths:
      - "localsend-main/cli/**"
      - "localsend-main/packages/core/**"
      - ".github/workflows/localsend-cli-win.yml"
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        working-directory: localsend-main
        run: rustup toolchain install
      - name: Build localsend-cli and run unit tests
        working-directory: localsend-main
        run: |
          cargo test --package localsend-cli
          cargo build --release --package localsend-cli
      - name: End-to-end headless receive & send test
        working-directory: localsend-main
        run: |
          $exe = "$PWD\target\release\localsend-cli.exe"
          $base = Join-Path $env:TEMP "ls_e2e"
          Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$base\rx_cfg", "$base\tx_cfg", "$base\rx_dest", "$base\tx_src" | Out-Null
          "hello from desksend" | Set-Content "$base\tx_src\test1.txt" -NoNewline
          "second file 12345"   | Set-Content "$base\tx_src\test2.txt" -NoNewline

          $env:XDG_CONFIG_HOME = "$base\rx_cfg"
          $rx = Start-Process $exe -ArgumentList "--port","53318","--destination","$base\rx_dest","receive","--auto-accept-from","127.0.0.1" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$base\rx.out" -RedirectStandardError "$base\rx.err"
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path "$base\rx.out") -and ((Get-Content "$base\rx.out" -Raw) -match "LOCALSEND_RECEIVER_READY")) { break }
            Start-Sleep -Milliseconds 300
          }
          Write-Host "--- Receiver initial output ---"
          Get-Content "$base\rx.out"

          $env:XDG_CONFIG_HOME = "$base\tx_cfg"
          & $exe --port 53319 send --to "127.0.0.1:53318" "$base\tx_src\test1.txt" "$base\tx_src\test2.txt"
          $sendExit = $LASTEXITCODE
          Start-Sleep 1
          Stop-Process $rx -Force -ErrorAction SilentlyContinue

          Write-Host "--- Receiver full stdout ---"
          Get-Content "$base\rx.out"
          Write-Host "--- Receiver stderr ---"
          Get-Content "$base\rx.err"

          if ($sendExit -ne 0) { throw "Send exited with $sendExit" }
          $c1 = Get-Content "$base\rx_dest\test1.txt" -Raw
          $c2 = Get-Content "$base\rx_dest\test2.txt" -Raw
          if ($c1 -ne "hello from desksend" -or $c2 -ne "second file 12345") {
            throw "Content mismatch: c1=$c1 c2=$c2"
          }
          Write-Host "E2E headless file transfer PASSED!"
      - uses: actions/upload-artifact@v4
        with:
          name: localsend-cli-win-x64
          path: localsend-main/target/release/localsend-cli.exe
          if-no-files-found: error
